name: Deploy to GitHub Pages

# Fallback host. Vercel is the primary one, so this runs only when asked:
# Actions → Deploy to GitHub Pages → Run workflow. It needs the repo to be
# public and Settings → Pages → Source set to "GitHub Actions".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from source
        run: ./build.sh

      - name: Fail if the committed build is stale
        # git status, not git diff: an output missing from the commit shows up
        # as untracked, which git diff would not report.
        run: |
          stale="$(git status --porcelain -- index.html lib/model.cjs oauth/consent.html)"
          if [ -n "$stale" ]; then echo "$stale"; echo "Run ./build.sh and commit what it builds."; exit 1; fi

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html favicon.svg favicon-32.png apple-touch-icon.png _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
